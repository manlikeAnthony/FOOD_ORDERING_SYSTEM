apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-ordering-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: food-ordering-app
  template:
    metadata:
      labels:
        app: food-ordering-app
    spec:
      containers:
      - name: food-ordering-app
        image: anthony119/food-ordering-app:v3
        ports:
        - containerPort: 5000

        env:
        - name: MONGO_URL
          valueFrom:
            secretKeyRef:
              name: food-app-secret
              key: MONGO_URL

        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: food-app-config
              key: PORT
        
        - name: MAPQUEST_API_KEY
          valueFrom:
            secretKeyRef:
              name: food-app-secret
              key: MAPQUEST_API_KEY